name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck ethz-vpn.sh MenuBar/Sources/ETHZVPNMenuBar/Resources/ethz-vpn-helper

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: swift build -c release --package-path MenuBar
